<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B5E35" />
  <title>PlantUp — AI Plant Care Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1B5E35; --fresh: #4CAF50; --light: #A5D6A7; --mint: #E8F5E9;
      --bg: #F7FAF7; --white: #FFFFFF; --text: #202820; --muted: #5F6E61; --border: #E0ECE1;
      --warn: #E68A00; --warn-bg: #FFF6E5; --shadow: 0 8px 24px rgba(27, 94, 53, 0.07);
      --radius-lg: 24px; --radius-md: 18px; --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(135deg, #DCE8DD 0%, #EDF4EE 100%); color: var(--text);
      font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh;
    }
    html[dir="rtl"] body { font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif; }
    .app-shell {
      width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh; background: var(--bg);
      position: relative; display: flex; flex-direction: column;
      box-shadow: 0 18px 55px rgba(27, 94, 53, 0.16); overflow-x: hidden;
    }
    .screen-content { flex: 1; padding: 18px 18px calc(104px + env(safe-area-inset-bottom)); overflow-y: auto; animation: screenIn 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
    .screen-content.no-pad { padding: 0 0 96px; }
    .screen-content.full-screen { padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(76,175,80,.45); } 70% { box-shadow: 0 0 0 12px rgba(76,175,80,0); } 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); } }
    @keyframes scanLaser { 0%, 100% { top: 12%; } 50% { top: 84%; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    @keyframes burstLeaf { 0% { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(140deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .anim-pop { animation: popIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .anim-float { animation: floatSlow 3.5s ease-in-out infinite; }
    h1 { font-size: 1.45rem; font-weight: 700; line-height: 1.3; }
    h2 { font-size: 1.12rem; font-weight: 700; }
    h3 { font-size: 0.95rem; font-weight: 600; }
    p { font-size: 0.89rem; color: var(--muted); line-height: 1.55; }
    .row { display: flex; align-items: center; }
    .between { justify-content: space-between; }
    .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
    .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; transition: transform .14s ease, opacity .15s ease, background .2s ease; }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { width: 100%; background: var(--forest); color: var(--white); font-weight: 600; font-size: 0.95rem; padding: 15px 20px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(27,94,53,.24); }
    .btn-secondary { width: 100%; background: var(--mint); color: var(--forest); font-weight: 600; font-size: 0.9rem; padding: 13px 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-danger { background: #FDECEC; color: #B71C1C; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); color: var(--text); flex-shrink: 0; }
    .card { background: var(--white); border-radius: var(--radius-md); padding: 15px; box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
    .card-interactive:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(27,94,53,.11); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--mint); color: var(--forest); }
    .pill.fresh { background: #E3F5E5; color: #2E7D32; }
    .pill.warn { background: var(--warn-bg); color: #B26A00; }
    .photo-box { position: relative; overflow: hidden; border-radius: var(--radius-sm); background: var(--mint); }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .45s cubic-bezier(.22,1,.36,1); }
    .card-interactive:hover .photo-box img { transform: scale(1.06); }
    .photo-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
    .search-box { background: var(--white); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; font-family: inherit; font-size: .9rem; color: var(--text); }
    .h-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .chip { padding: 8px 15px; border-radius: 999px; background: var(--white); border: 1px solid var(--border); font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .chip.active { background: var(--forest); color: var(--white); border-color: var(--forest); }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 8px 6px calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; color: var(--muted); padding: 4px 0; }
    .nav-item.active { color: var(--forest); }
    .nav-scan-wrap { display: flex; justify-content: center; margin-top: -30px; }
    .nav-scan-btn { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--forest), var(--fresh)); color: var(--white); display: flex; align-items: center; justify-content: center; border: 4px solid var(--bg); animation: pulseRing 2.6s infinite; }
    html[dir="rtl"] .flip-rtl { transform: scaleX(-1); }
    .onboard-wrap { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 22px 22px 30px; background: radial-gradient(circle at top right, #DDF2DF 0%, #F7FAF7 58%); }
    .onboard-hero { height: 290px; border-radius: 30px; overflow: hidden; box-shadow: 0 18px 38px rgba(27,94,53,.16); margin: 18px 0; position: relative; background: var(--mint); }
    .onboard-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .onboard-float-tag { position: absolute; bottom: 14px; inset-inline-start: 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 999px; font-size: .78rem; font-weight: 700; color: var(--forest); box-shadow: var(--shadow); }
    .dots { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--light); transition: .25s; }
    .dot.active { width: 26px; background: var(--forest); }
    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .quick-card { background: var(--mint); border-radius: var(--radius-md); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: .8rem; font-weight: 700; color: var(--forest); }
    .task-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: .22s cubic-bezier(.34,1.56,.64,1); }
    .task-check.done { background: var(--fresh); border-color: var(--fresh); color: var(--white); transform: scale(1.08); }
    .scanner-box { background: #101D14; border-radius: var(--radius-lg); height: 290px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--white); }
    .scanner-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
    .scanner-frame { width: 210px; height: 210px; border: 2.5px dashed var(--light); border-radius: 28px; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; text-align: center; padding: 14px; background: rgba(16,29,20,.38); }
    .scan-line { position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 99px; background: var(--fresh); box-shadow: 0 0 14px 2px var(--fresh); animation: scanLaser 1.25s infinite ease-in-out; }
    .scan-result-item { padding: 8px 0; border-top: 1px solid var(--border); }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--light); border-top-color: var(--forest); border-radius: 50%; animation: spin .8s linear infinite; margin: 20px auto; }
    .mode-switch { background: var(--white); padding: 4px; border-radius: 999px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); }
    .mode-btn { padding: 8px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; color: var(--muted); }
    .mode-btn.active { background: var(--forest); color: var(--white); }
    .plant-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric-card { background: var(--white); border-radius: var(--radius-md); padding: 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
    .metric-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--mint); color: var(--forest); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button { width: 30px; height: 30px; border-radius: 50%; background: var(--mint); color: var(--forest); font-weight: 700; font-size: 1.1rem; }
    .chat-area { display: flex; flex-direction: column; gap: 12px; padding-bottom: 76px; }
    .bubble { max-width: 84%; padding: 12px 15px; border-radius: 18px; font-size: .88rem; line-height: 1.55; animation: popIn .25s ease; }
    .bubble.ai { background: var(--white); color: var(--text); align-self: flex-start; box-shadow: var(--shadow); border-end-start-radius: 4px; }
    .bubble.user { background: var(--forest); color: var(--white); align-self: flex-end; border-end-end-radius: 4px; }
    .typing-dots { display: flex; gap: 5px; padding: 4px 2px; }
    .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--fresh); animation: bounceDot 1.1s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: .16s; } .typing-dots span:nth-child(3) { animation-delay: .32s; }
    .chat-dock { position: fixed; bottom: 76px; width: 100%; max-width: 430px; padding: 8px 14px; background: linear-gradient(180deg, transparent, var(--bg) 30%); }
    .chat-input-wrap { background: var(--white); border-radius: 999px; border: 1px solid var(--border); padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
    .chat-input-wrap input { border: none; outline: none; flex: 1; font-family: inherit; font-size: .88rem; }
    .send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--fresh); color: var(--white); display: flex; align-items: center; justify-content: center; }
    .plan-card { background: var(--white); border: 2px solid var(--border); border-radius: var(--radius-md); padding: 16px; position: relative; transition: .2s; }
    .plan-card.selected { border-color: var(--forest); background: var(--mint); transform: scale(1.01); }
    .best-badge { position: absolute; top: -11px; inset-inline-end: 16px; background: linear-gradient(90deg, var(--fresh), #66BB6A, var(--fresh)); background-size: 200% 100%; animation: shimmer 2.5s infinite linear; color: var(--white); font-size: .72rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
    .switch { width: 46px; height: 26px; border-radius: 999px; background: #CBD8CC; position: relative; transition: .2s; }
    .switch.on { background: var(--fresh); }
    .switch::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); transition: .22s; }
    .switch.on::after { transform: translateX(20px); }
    html[dir="rtl"] .switch.on::after { transform: translateX(-20px); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(16,29,20,.45); backdrop-filter: blur(4px); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
    .modal-sheet { width: 100%; max-width: 430px; background: var(--white); border-radius: 26px 26px 0 0; padding: 20px 20px 28px; animation: screenIn .25s ease; }
    .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--white); padding: 10px 18px; border-radius: 999px; font-size: .82rem; font-weight: 600; z-index: 120; box-shadow: 0 10px 26px rgba(0,0,0,.2); max-width: 90vw; text-align: center; }
    .burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
    .burst-item { position: fixed; font-size: 1.2rem; animation: burstLeaf .85s cubic-bezier(.16,1,.3,1) forwards; }
    .empty { text-align: center; padding: 34px 10px; }
    .empty .big { font-size: 2.6rem; }
    .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div class="app-shell" id="app">
    <div style="padding:40px 22px; text-align:center; margin:auto;">
      <h2 style="color:#1B5E35;">🌿 PlantUp</h2>
      <p style="margin-top:10px;">لو ظهرت لك هذه الرسالة ولم يفتح التطبيق، افتح الملف في Chrome.</p>
    </div>
  </div>
  <div class="burst-layer" id="burst-layer"></div>

  <script>
    window.addEventListener('error', function (event) {
      const app = document.getElementById('app');
      if (app && !app.dataset.runtimeError) {
        app.dataset.runtimeError = '1';
        app.innerHTML = '<div style="padding:28px;text-align:center;margin:auto"><h2 style="color:#1B5E35">PlantUp error</h2><p style="margin-top:10px;direction:ltr;overflow-wrap:anywhere">' + String(event.message || 'Unknown error') + '</p></div>';
      }
    });

    const icons = {
      home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
      plant: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>',
      camera: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      compass: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
      sparkle: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      back: '<svg class="flip-rtl" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>',
      search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      crown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>',
      drop: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
      room: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>',
      cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      doctor: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/></svg>',
      send: '<svg class="flip-rtl" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
      user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      upload: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
      grid: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
      list: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>'
    };

    /* ---------- Images ---------- */
    function fallbackSvg() {
      return '<svg viewBox="0 0 100 100" width="100%" height="100%" style="background:#E8F5E9;"><rect x="36" y="74" width="28" height="16" rx="4" fill="#D7CCC8" stroke="#1B5E35" stroke-width="1.8"/><path d="M50 74 V38 M50 58 C34 55 28 42 33 32 C44 35 50 45 50 58 Z M50 48 C66 45 73 33 67 22 C56 26 50 36 50 48 Z" fill="#4CAF50" stroke="#1B5E35" stroke-width="2"/></svg>';
    }
    function plantPhoto(p, style) {
      style = style || '';
      const has = p && p.img;
      return '<div class="photo-box" style="' + style + '">' +
        (has ? '<img src="' + esc(p.img) + '" alt="' + esc(pname(p)) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';" />' : '') +
        '<div class="photo-fallback" style="' + (has ? '' : 'display:flex;') + '">' + fallbackSvg() + '</div></div>';
    }

    /* ---------- Translations (UI only — no plant data) ---------- */
    const T = {
      en: {
        skip: 'Skip', next: 'Next', getStarted: 'Get Started',
        slides: [

    function triggerBurst(x, y, emoji) {
      const layer = document.getElementById('burst-layer'); if (!layer) return;
      const cx = x || window.innerWidth / 2, cy = y || window.innerHeight / 2;
      const items = [emoji || '🌿', '💧', '✨', '🌱', '🍃'];
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('span');
        el.className = 'burst-item'; el.textContent = items[i % items.length];
        el.style.left = cx + 'px'; el.style.top = cy + 'px';
        el.style.setProperty('--tx', (Math.random() * 140 - 70) + 'px');

    function daysLeft(p) {

      const d = daysLeft(p);

      return t().waterIn(d);

    /* ---------- Web data: Wikipedia ---------- */
    function bigThumb(url) { return url ? url.replace(/\/\d+px-/, '/640px-') : ''; }
    async function wikiSummary(lg, title) {
      try {
        const r = await fetch('https://' + lg + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(String(title).replace(/ /g, '_')) + '?redirect=true');
        if (!r.ok) return null;
        const d = await r.json();
        if (d.type === 'disambiguation' || !d.extract) return null;
        return d;
      } catch (e) { return null; }
    }
    async function wikiInfo(sci) {
      const res = await Promise.all([wikiSummary('en', sci), wikiSummary('ar', sci)]);
      return { en: res[0], ar: res[1] };
    }
    function wikiImage(d) {
      if (!d) return '';
      if (d.thumbnail && d.thumbnail.source) return bigThumb(d.thumbnail.source);

      return '';
    }

      if (target === 'identify') { render(); identifyPlant(file); } else { runDoctorDemo(); }
      e.target.value = '';
    }
    function captureAndIdentify() {
      const video = document.getElementById('live-video');
      if (!liveStream || !video || !video.videoWidth) { showToast(state.lang === 'ar' ? 'افتح الكاميرا أولاً وانتظر ظهور الصورة' : 'Start the camera first'); return; }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        if (!blob) { showToast('Capture failed'); return; }
        state.scanImg = canvas.toDataURL('image/jpeg', 0.9);
        const f = new File([blob], 'plantup-scan.jpg', { type: 'image/jpeg' });
        stopCamera(); identifyPlant(f);
      }, 'image/jpeg', 0.9);
    }

    async function identifyPlant(file) {
      state.scanError = null; scanResult = null;
      if (!file || !file.type || file.type.indexOf('image/') !== 0) {
        state.scanError = state.lang === 'ar' ? 'الملف المختار ليس صورة.' : 'The selected file is not an image.'; render(); return;
      }
      state.scanning = true; scanStatus = t().identifying; render();
      try {
        let uploadFile = file;
        if (file.type !== 'image/jpeg' && file.type !== 'image/png') {
          const bitmap = await createImageBitmap(file);
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width; canvas.height = bitmap.height;
          canvas.getContext('2d').drawImage(bitmap, 0, 0);
          const blob = await new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', 0.9); });
          if (!blob) throw new Error('Could not convert this image. Try JPG or PNG.');
          uploadFile = new File([blob], 'plantup-photo.jpg', { type: 'image/jpeg' });
        }
        const apiKey = getPlantNetApiKey();
        if (!apiKey) throw new Error(state.lang === 'ar' ? 'لم يتم إدخال مفتاح Pl@ntNet API.' : 'No Pl@ntNet API key entered.');
        const form = new FormData();
        form.append('images', uploadFile, uploadFile.name || 'plant.jpg');
        form.append('organs', 'auto');
        const url = PLANTNET_API_URL + '?lang=' + (state.lang === 'ar' ? 'ar' : 'en') + '&nb-results=5&include-related-images=true&api-key=' + encodeURIComponent(apiKey);
        const response = await fetch(url, { method: 'POST', body: form });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error((data.message || data.error || ('HTTP ' + response.status)) + ' (status ' + response.status + ')');

        const top = data.results && data.results[0];
        if (!top || !top.species) { showToast(t().noMatch); return; }

        scanStatus = t().fetching; render();
        const sp = top.species;
        const sci = sp.scientificNameWithoutAuthor || sp.scientificName || 'Unknown';
        const common = sp.commonNames || [];
        const wiki = await wikiInfo(sci);
        const pnImg = top.images && top.images[0] && top.images[0].url ? (top.images[0].url.m || top.images[0].url.o || '') : '';
        const img = wikiImage(wiki.en) || wikiImage(wiki.ar) || pnImg;

        const plant = {
          id: slug(sci), sci: sci,
          nameEn: (state.lang === 'en' && common[0]) || (wiki.en && wiki.en.title) || sci,
          nameAr: (state.lang === 'ar' && common[0]) || (wiki.ar && wiki.ar.title) || '',
          commonNames: common.slice(0, 4),
          img: img,
          descEn: wiki.en ? wiki.en.extract : '', descAr: wiki.ar ? wiki.ar.extract : '',
          wikiUrl: (wiki.en && wiki.en.content_urls && wiki.en.content_urls.desktop.page) || (wiki.ar && wiki.ar.content_urls && wiki.ar.content_urls.desktop.page) || ''
        };
        const score = top.score || 0;
        const existed = !!state.plants.find(function (x) { return x.id === plant.id; });
        const low = score < 0.15;
        let saved = existed;
        if (!existed && !low) { savePlant(plant, 1); saved = true; }
        scanResult = {
          plant: existed ? state.plants.find(function (x) { return x.id === plant.id; }) : plant,
          score: score, existed: existed, saved: saved, low: low && !existed,
          alts: (data.results || []).slice(1, 4).map(function (r) { return { sci: r.species && (r.species.scientificNameWithoutAuthor || r.species.scientificName), score: r.score || 0 }; }),
          remaining: data.remainingIdentificationRequests
        };
        triggerBurst(null, 240, '🌿');
      } catch (error) {
        const msg = String(error && error.message || error);
        state.scanError = msg.indexOf('Failed to fetch') >= 0
          ? (state.lang === 'ar' ? 'تعذر الاتصال بخدمة Pl@ntNet (إنترنت أو CORS). جرّب فتح الصفحة من HTTPS.' : 'Could not reach Pl@ntNet (network or CORS). Try an HTTPS-hosted page.')
          : msg;
      } finally { state.scanning = false; scanStatus = ''; render(); }
    }

    /* ---------- Discover (live Wikipedia search) ---------- */
    async function runDiscover(q) {
      q = String(q || '').trim(); if (!q) return;
      discover.q = q; discover.loading = true; discover.error = ''; render();
      const lg = state.lang === 'ar' ? 'ar' : 'en';
      const term = q + (lg === 'ar' ? ' نبات' : ' plant');
      const url = 'https://' + lg + '.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=10&gsrsearch=' + encodeURIComponent(term) +
        '&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=600&exintro=1&explaintext=1&exsentences=3&exlimit=max';
      try {
        const r = await fetch(url); const d = await r.json();
        const pages = d.query && d.query.pages ? Object.keys(d.query.pages).map(function (k) { return d.query.pages[k]; }) : [];
        pages.sort(function (a, b) { return (a.index || 0) - (b.index || 0); });
        discover.results = pages.filter(function (pg) { return pg.thumbnail && pg.extract; }).map(function (pg) {
          const p = { id: slug(pg.title), sci: pg.title, nameEn: lg === 'en' ? pg.title : '', nameAr: lg === 'ar' ? pg.title : '',
            img: pg.thumbnail.source, descEn: lg === 'en' ? pg.extract : '', descAr: lg === 'ar' ? pg.extract : '',
            wikiUrl: 'https://' + lg + '.wikipedia.org/?curid=' + pg.pageid };
          return p;
        });
      } catch (e) { discover.error = state.lang === 'ar' ? 'تعذر البحث. تأكد من الإنترنت.' : 'Search failed. Check your connection.'; discover.results = []; }
      discover.loading = false; render();
    }

        let ar = 'سؤال ممتاز! معظم النباتات المنزلية تفضل الإضاءة الساطعة غير المباشرة. اختبر دائماً جفاف أول 3 سم من التربة بإصبعك قبل الري.';
        if (lower.indexOf('yellow') > -1 || q.indexOf('اصفر') > -1 || q.indexOf('تصفر') > -1) {

          ar = 'اصفرار الأوراق يشير غالباً إلى زيادة الري أو انسداد فتحات التصريف. اترك التربة تجف قليلاً وتخلّص من الماء الزائد.';
        } else if (lower.indexOf('low') > -1 || q.indexOf('ضعيفة') > -1 || q.indexOf('قليلة') > -1) {
          en = 'Golden Pothos, Snake Plant, and ZZ Plant are top champions for low-light rooms!';
          ar = 'نبتة البوتس الذهبية، جلد النمر، ونبتة الزاميا هي الأفضل للغرف ذات الإضاءة الضعيفة!';
        } else if (lower.indexOf('propagat') > -1 || q.indexOf('اكثار') > -1 || q.indexOf('إكثار') > -1 || q.indexOf('أكثر') > -1) {
          en = 'To propagate Pothos: snip just below a node, place in clean water near bright light, and roots will sprout within 2 weeks!';
          ar = 'لإكثار البوتس: قص غصناً أسفل العقدة مباشرة، وضعه في ماء نظيف بمكان مضيء وستظهر الجذور خلال أسبوعين!';
        }
        state.messages.push({ sender: 'ai', en: en, ar: ar }); saveState(); render();
        window.scrollTo(0, document.body.scrollHeight);
      }, 700);
    }

            return '<div class="row gap-12" style="align-items:flex-start;"><span class="pill" style="min-width:26px; justify-content:center;">' + (i + 1) + '</span><p style="color:var(--text);">' + st + '</p></div>';
          }).join('') + '</div><button class="btn-secondary mt-16" onclick="askAIWithContext()">' + t().askDocAI + '</button></div>' : '') +
      '</div>';
    }

    function renderAI() {
      const ar = state.lang === 'ar';
      const msgs = state.messages.length ? state.messages : [{ sender: 'ai', en: T.en.aiHello, ar: T.ar.aiHello }];
      return '<div class="screen-content">' +
        '<div class="card row gap-12" style="padding:12px 14px;"><div class="metric-icon" style="border-radius:50%; background:var(--forest); color:var(--white);">' + icons.plant + '</div>' +
          '<div><h3>' + t().aiTitle + '</h3><p style="font-size:.75rem; color:var(--fresh); font-weight:600;">' + t().aiSub + '</p></div></div>' +
        '<div class="h-scroll mt-12">' + t().aiPrompts.map(function (q) {
          return '<button class="chip" style="background:var(--mint); border-color:transparent; color:var(--forest);" onclick="sendChat(this.textContent)">' + esc(q) + '</button>';
        }).join('') + '</div>' +
        '<div class="chat-area mt-16">' + msgs.map(function (m) {
          return '<div class="bubble ' + m.sender + '">' + (m.custom ? esc(m.custom) : esc(ar ? m.ar : m.en)) + '</div>';
        }).join('') + (aiTyping ? '<div class="bubble ai"><div class="typing-dots"><span></span><span></span><span></span></div></div>' : '') + '</div></div>' +
        '<div class="chat-dock"><form class="chat-input-wrap" onsubmit="event.preventDefault(); var inp=document.getElementById(\'chat-inp\'); if(inp.value.trim()){ sendChat(inp.value); inp.value=\'\'; }">' +
          '<input id="chat-inp" type="text" placeholder="' + t().aiPlaceholder + '" /><button type="submit" class="send-btn">' + icons.send + '</button></form></div>';
    }

    function buildMyPlantsGrid(query) {
      const q = String(query || '').trim().toLowerCase();
      const list = state.plants
        .filter(function (p) { return state.roomFilter === 0 || p.roomIdx === state.roomFilter; })
        .filter(function (p) { return !q || (p.nameEn || '').toLowerCase().indexOf(q) > -1 || (p.nameAr || '').indexOf(q) > -1 || (p.sci || '').toLowerCase().indexOf(q) > -1; });
      if (!list.length) return '<p style="grid-column:1/-1; text-align:center;">—</p>';
      return list.map(function (p) {
        if (state.myViewMode === 'list') {
          return '<div class="card card-interactive row between" style="cursor:pointer;" onclick="openPlant(\'' + p.id + '\')">' +
            '<div class="row gap-12">' + plantPhoto(p, 'width:62px; height:62px; flex-shrink:0;') +
            '<div><h3>' + esc(pname(p)) + '</h3><p style="font-size:.76rem;">' + t().rooms[p.roomIdx] + '</p></div></div>' +
            '<span class="pill" style="font-size:.72rem;">' + nextText(p) + '</span></div>';
        }
        return '<div class="card card-interactive anim-pop" style="padding:10px; cursor:pointer;" onclick="openPlant(\'' + p.id + '\')">' + plantPhoto(p, 'height:128px;') +
          '<h3 class="mt-8">' + esc(pname(p)) + '</h3><p style="font-size:.74rem;">' + t().rooms[p.roomIdx] + '</p>' +
          '<span class="pill mt-8" style="font-size:.7rem;">' + nextText(p) + '</span></div>';
      }).join('');
    }
    function filterMyPlants(val) { const el = document.getElementById('my-plants-grid'); if (el) el.innerHTML = buildMyPlantsGrid(val); }

    function renderMyPlants() {
      const sorted = state.plants.slice().sort(function (a, b) { return daysLeft(a) - daysLeft(b); });
      return '<div class="screen-content">' +
        '<div class="row between"><h1>' + t().myJungle + '</h1><div class="row gap-8">' +
          (state.plantsSubTab === 'collection' ? '<button class="icon-btn" onclick="state.myViewMode = state.myViewMode===\'grid\'?\'list\':\'grid\'; saveState(); render();">' + (state.myViewMode === 'grid' ? icons.list : icons.grid) + '</button>' : '') +
          '<button class="icon-btn" style="background:var(--forest); color:var(--white);" onclick="go(\'profile\')">' + icons.user + '</button></div></div>' +
        '<div class="mode-switch mt-16">' +
          '<button class="mode-btn ' + (state.plantsSubTab === 'collection' ? 'active' : '') + '" onclick="state.plantsSubTab=\'collection\'; render()">' + t().colTab + '</button>' +
          '<button class="mode-btn ' + (state.plantsSubTab === 'care' ? 'active' : '') + '" onclick="state.plantsSubTab=\'care\'; render()">' + t().careTab + '</button></div>' +
        (state.plants.length === 0 ? emptyState() :
          (state.plantsSubTab === 'collection' ?
            '<div class="search-box mt-12">' + icons.search + '<input type="text" placeholder="' + t().searchPlants + '" oninput="filterMyPlants(this.value)" /></div>' +
            '<div class="h-scroll mt-12">' + t().rooms.map(function (r, i) { return '<button class="chip ' + (state.roomFilter === i ? 'active' : '') + '" onclick="state.roomFilter=' + i + '; render()">' + r + '</button>'; }).join('') + '</div>' +
            '<div class="' + (state.myViewMode === 'grid' ? 'plant-grid' : '') + ' mt-16" style="' + (state.myViewMode === 'list' ? 'display:flex;flex-direction:column;gap:10px;' : '') + '" id="my-plants-grid">' + buildMyPlantsGrid('') + '</div>'
          :
            '<div style="display:flex; flex-direction:column; gap:10px;" class="mt-16">' + sorted.map(function (p) {
              const due = daysLeft(p) <= 0;
              return '<div class="card row between"><div class="row gap-12" style="cursor:pointer;" onclick="openPlant(\'' + p.id + '\')">' + plantPhoto(p, 'width:50px; height:50px; flex-shrink:0;') +
                '<div><h3>' + esc(pname(p)) + '</h3><span class="pill ' + (due ? 'warn' : 'fresh') + '" style="margin-top:4px; font-size:.72rem;">' + nextText(p) + '</span></div></div>' +
                '<button class="task-check ' + (due ? '' : 'done') + '" onclick="waterPlant(\'' + p.id + '\', event)">' + (due ? icons.drop : icons.check) + '</button></div>';
            }).join('') + '</div>')) +
      '</div>';
    }

    function renderDiscoverResults() {
      if (discover.loading) return '<div class="spinner"></div><p style="text-align:center;">' + t().searching + '</p>';
      if (discover.error) return '<p class="mt-16" style="text-align:center;">' + esc(discover.error) + '</p>';
      if (!discover.results) return '';
      if (!discover.results.length) return '<p class="mt-16" style="text-align:center;">' + t().noResults + '</p>';
      return '<div class="plant-grid mt-16">' + discover.results.map(function (p, i) {
        return '<div class="card card-interactive anim-pop" style="padding:10px; cursor:pointer;" onclick="openTransient(' + i + ')">' + plantPhoto(p, 'height:125px;') +
          '<h3 class="mt-8">' + esc(pname(p)) + '</h3></div>';
      }).join('') + '</div>';
    }
    function renderDiscover() {
      return '<div class="screen-content"><h1>' + t().discoverTitle + '</h1>' +
        '<form class="search-box mt-12" onsubmit="event.preventDefault(); runDiscover(document.getElementById(\'disc-inp\').value);">' + icons.search +
          '<input id="disc-inp" type="text" value="' + esc(discover.q) + '" placeholder="' + t().searchDiscover + '" /></form>' +
        '<div class="h-scroll mt-12">' + t().suggest.map(function (s) { return '<button class="chip" onclick="runDiscover(this.textContent)">' + esc(s) + '</button>'; }).join('') + '</div>' +
        renderDiscoverResults() +
        '<h2 class="mt-20">' + t().tipsGuides + '</h2>' +
        '<div class="card mt-12" style="display:flex; flex-direction:column; gap:12px;">' +
          '<div class="row between" onclick="activeModal={type:\'article\', idx:1}; render();" style="cursor:pointer;"><h3>' + t().tip1Title + '</h3><span class="pill">3 min</span></div>' +
          '<hr style="border:none; border-top:1px solid var(--border);" />' +
          '<div class="row between" onclick="activeModal={type:\'article\', idx:2}; render();" style="cursor:pointer;"><h3>' + t().tip2Title + '</h3><span class="pill">3 min</span></div></div></div>';
    }

    function renderPremium() {
      return '<div class="screen-content no-pad">' +
        '<div style="background:linear-gradient(150deg, var(--forest), var(--fresh)); color:var(--white); padding:22px 20px 30px; border-radius:0 0 28px 28px;">' +
          '<button class="icon-btn" style="background:rgba(255,255,255,.2); color:var(--white);" onclick="go(state.prevScreen || \'home\')">' + icons.back + '</button>' +
          '<h1 style="color:var(--white); margin-top:16px;">' + t().proTitle + '</h1><p style="color:rgba(255,255,255,.9); margin-top:6px;">' + t().proSub + '</p></div>' +
        '<div style="padding:18px;"><div class="card" style="display:flex; flex-direction:column; gap:12px;">' +
          t().proPerks.map(function (perk) { return '<div class="row gap-12"><span class="task-check done">' + icons.check + '</span><span style="font-size:.88rem; font-weight:600;">' + perk + '</span></div>'; }).join('') + '</div>' +
          '<div class="plan-card mt-20 ' + (state.selectedPlan === 'annual' ? 'selected' : '') + '" onclick="state.selectedPlan=\'annual\'; render()" style="cursor:pointer;"><span class="best-badge">' + t().bestValue + '</span>' +
            '<div class="row between"><div><h3>' + t().annual + '</h3><p style="font-size:.76rem;">' + t().annualNote + '</p></div><strong style="font-size:1.1rem; color:var(--forest);">' + t().annualPrice + '</strong></div></div>' +
          '<div class="plan-card mt-12 ' + (state.selectedPlan === 'monthly' ? 'selected' : '') + '" onclick="state.selectedPlan=\'monthly\'; render()" style="cursor:pointer;">' +
            '<div class="row between"><div><h3>' + t().monthly + '</h3><p style="font-size:.76rem;">' + t().monthlyNote + '</p></div><strong style="font-size:1.05rem;">' + t().monthlyPrice + '</strong></div></div>' +
          '<button class="btn-primary mt-20" onclick="state.isPro=true; saveState(); triggerBurst(null,null,\'✨\'); showToast(t().toastPro); go(\'home\')">' + (state.isPro ? t().proActive : t().startTrial) + '</button></div></div>';
    }

    function renderProfile() {
      return '<div class="screen-content">' +
        '<div class="row gap-12"><button class="icon-btn" onclick="go(state.prevScreen || \'home\')">' + icons.back + '</button><h2>' + t().profileTitle + '</h2></div>' +
        '<div class="card row between mt-16"><div class="row gap-12"><div class="metric-icon" style="width:52px; height:52px; border-radius:50%; background:var(--forest); color:var(--white);">' + icons.user + '</div>' +
          '<div><span class="pill ' + (state.isPro ? 'fresh' : '') + '">' + (state.isPro ? t().proMember : t().freeMember) + '</span></div></div>' +
          (!state.isPro ? '<button class="chip active" onclick="go(\'premium\')">' + t().upgradeNow + '</button>' : '') + '</div>' +
        '<h3 class="mt-20" style="color:var(--muted);">' + t().prefs + '</h3>' +
        '<div class="card mt-8"><div class="row between"><span style="font-weight:600; font-size:.9rem;">' + t().langLabel + '</span><div class="mode-switch" style="width:140px;">' +
          '<button class="mode-btn ' + (state.lang === 'ar' ? 'active' : '') + '" style="padding:6px;" onclick="setLang(\'ar\')">عربي</button>' +
          '<button class="mode-btn ' + (state.lang === 'en' ? 'active' : '') + '" style="padding:6px;" onclick="setLang(\'en\')">EN</button></div></div></div>' +
        '<h3 class="mt-20" style="color:var(--muted);">' + t().notifs + '</h3>' +
        '<div class="card mt-8" style="display:flex; flex-direction:column; gap:14px;">' +
          '<div class="row between"><span style="font-weight:600; font-size:.9rem;">' + t().careRem + '</span><button class="switch ' + (state.notifCare ? 'on' : '') + '" onclick="state.notifCare=!state.notifCare; saveState(); render()"></button></div>' +
          '<div class="row between"><span style="font-weight:600; font-size:.9rem;">' + t().weatherRem + '</span><button class="switch ' + (state.notifWeather ? 'on' : '') + '" onclick="state.notifWeather=!state.notifWeather; saveState(); render()"></button></div></div>' +
        '<button class="btn-secondary mt-20" onclick="state.onboarded=false; state.onboardSlide=0; saveState(); render();">' + t().replayOnboard + '</button>' +
        '<button class="btn-secondary btn-danger mt-8" onclick="resetAll()">' + t().resetDemo + '</button></div>';
    }

    function renderModal() {
      if (!activeModal) return '';
      if (activeModal.type === 'article') {
        const title = activeModal.idx === 1 ? t().tip1Title : t().tip2Title;
        const body = activeModal.idx === 1 ? t().tip1Body : t().tip2Body;
        return '<div class="modal-backdrop" onclick="if(event.target===this){activeModal=null; render();}"><div class="modal-sheet"><span class="pill">3 min</span><h2 class="mt-12">' + title + '</h2><p class="mt-12" style="color:var(--text);">' + body + '</p><button class="btn-primary mt-20" onclick="activeModal=null; render();">OK</button></div></div>';
      }
      if (activeModal.type === 'room') {
        return '<div class="modal-backdrop" onclick="if(event.target===this){activeModal=null; render();}"><div class="modal-sheet"><h2>' + t().chooseRoom + '</h2><div style="display:flex; flex-direction:column; gap:10px;" class="mt-16">' +
          [1, 2, 3].map(function (r) { return '<button class="btn-secondary" onclick="chooseRoom(' + r + ', event)">' + t().rooms[r] + '</button>'; }).join('') + '</div></div></div>';
      }
      return '';
    }

    function render() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      const app = document.getElementById('app');
      if (!state.onboarded) { app.innerHTML = renderOnboarding(); return; }
      if (state.screen === 'details' && !viewing) state.screen = 'home';

      let body = '';
      const s = state.screen;
      if (s === 'home') body = renderHome();
      else if (s === 'identify') body = renderIdentify();
      else if (s === 'details') body = renderDetails();
      else if (s === 'doctor') body = renderDoctor();
      else if (s === 'ai') body = renderAI();
      else if (s === 'myplants') body = renderMyPlants();
      else if (s === 'discover') body = renderDiscover();
      else if (s === 'premium') body = renderPremium();
      else if (s === 'profile') body = renderProfile();

      const hideNav = ['details', 'premium'].indexOf(s) > -1;
      const nav = hideNav ? '' : '<nav class="bottom-nav">' +
        '<button class="nav-item ' + (s === 'home' ? 'active' : '') + '" onclick="go(\'home\')">' + icons.home + '<span>' + t().nav.home + '</span></button>' +
        '<button class="nav-item ' + (s === 'myplants' ? 'active' : '') + '" onclick="go(\'myplants\')">' + icons.plant + '<span>' + t().nav.plants + '</span></button>' +
        '<div class="nav-scan-wrap"><button class="nav-scan-btn" onclick="go(\'identify\')">' + icons.camera + '</button></div>' +
        '<button class="nav-item ' + (s === 'discover' ? 'active' : '') + '" onclick="go(\'discover\')">' + icons.compass + '<span>' + t().nav.discover + '</span></button>' +
        '<button class="nav-item ' + (s === 'ai' ? 'active' : '') + '" onclick="go(\'ai\')">' + icons.sparkle + '<span>' + t().nav.ai + '</span></button></nav>';

      app.innerHTML = body + nav + renderModal();
      if (liveStream) { const vid = document.getElementById('live-video'); if (vid) vid.srcObject = liveStream; }
    }

    render();
  </script>
</body>
</html>
