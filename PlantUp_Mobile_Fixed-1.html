<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B5E35" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>PlantUp — AI Plant Care Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1B5E35;
      --fresh: #4CAF50;
      --light: #A5D6A7;
      --mint: #E8F5E9;
      --bg: #F7FAF7;
      --white: #FFFFFF;
      --text: #202820;
      --muted: #5F6E61;
      --border: #E0ECE1;
      --warn: #E68A00;
      --warn-bg: #FFF6E5;
      --shadow: 0 8px 24px rgba(27, 94, 53, 0.07);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(135deg, #DCE8DD 0%, #EDF4EE 100%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }
    html[dir="rtl"] body {
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 55px rgba(27, 94, 53, 0.16);
      overflow-x: hidden;
    }

    .screen-content {
      flex: 1;
      padding: 18px 18px calc(104px + env(safe-area-inset-bottom));
      overflow-y: auto;
      animation: screenIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .screen-content.no-pad { padding: 0 0 96px; }
    .screen-content.full-screen { padding: 0; display: flex; flex-direction: column; min-height: 100vh; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    @keyframes scanLaser {
      0%, 100% { top: 12%; }
      50% { top: 84%; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes burstLeaf {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(140deg); }
    }

    .anim-pop { animation: popIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .anim-float { animation: floatSlow 3.5s ease-in-out infinite; }

    h1 { font-size: 1.45rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    h2 { font-size: 1.12rem; font-weight: 700; color: var(--text); }
    h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    p { font-size: 0.89rem; color: var(--muted); line-height: 1.55; }

    .row { display: flex; align-items: center; }
    .between { justify-content: space-between; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }

    button {
      font-family: inherit; cursor: pointer; border: none; background: none; color: inherit;
      transition: transform 0.14s ease, opacity 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    button:active { transform: scale(0.96); }

    .btn-primary {
      width: 100%; background: var(--forest); color: var(--white);
      font-weight: 600; font-size: 0.95rem; padding: 15px 20px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 20px rgba(27, 94, 53, 0.24);
    }
    .btn-secondary {
      width: 100%; background: var(--mint); color: var(--forest);
      font-weight: 600; font-size: 0.9rem; padding: 13px 18px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--white);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); color: var(--text); flex-shrink: 0;
    }

    .card {
      background: var(--white); border-radius: var(--radius-md); padding: 15px;
      box-shadow: var(--shadow); transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-interactive:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(27, 94, 53, 0.11); }

    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 999px; font-size: 0.76rem; font-weight: 600;
      background: var(--mint); color: var(--forest);
    }
    .pill.fresh { background: #E3F5E5; color: #2E7D32; }
    .pill.warn { background: var(--warn-bg); color: #B26A00; }

    .photo-box {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-sm);
      background: var(--mint);
    }
    .photo-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-interactive:hover .photo-box img { transform: scale(1.06); }
    .photo-fallback {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    }

    .search-box {
      background: var(--white); border: 1px solid var(--border); border-radius: 999px;
      padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    }
    .search-box input {
      border: none; outline: none; background: transparent; width: 100%;
      font-family: inherit; font-size: 0.9rem; color: var(--text);
    }

    .h-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }

    .chip {
      padding: 8px 15px; border-radius: 999px; background: var(--white);
      border: 1px solid var(--border); font-size: 0.82rem; font-weight: 600;
      color: var(--muted); white-space: nowrap;
    }
    .chip.active { background: var(--forest); color: var(--white); border-color: var(--forest); }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 430px;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
      padding: 8px 6px calc(12px + env(safe-area-inset-bottom)); z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.7rem; font-weight: 600; color: var(--muted); padding: 4px 0;
    }
    .nav-item.active { color: var(--forest); }
    .nav-scan-wrap { display: flex; justify-content: center; margin-top: -30px; }
    .nav-scan-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, var(--forest), var(--fresh));
      color: var(--white); display: flex; align-items: center; justify-content: center;
      border: 4px solid var(--bg);
      animation: pulseRing 2.6s infinite;
    }

    html[dir="rtl"] .flip-rtl { transform: scaleX(-1); }

    .onboard-wrap {
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
      padding: 22px 22px 30px;
      background: radial-gradient(circle at top right, #DDF2DF 0%, #F7FAF7 58%);
    }
    .onboard-hero {
      height: 290px; border-radius: 30px; overflow: hidden;
      box-shadow: 0 18px 38px rgba(27, 94, 53, 0.16);
      margin: 18px 0; position: relative; background: var(--mint);
    }
    .onboard-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .onboard-float-tag {
      position: absolute; bottom: 14px; inset-inline-start: 14px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      padding: 8px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      color: var(--forest); box-shadow: var(--shadow);
    }
    .dots { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--light); transition: 0.25s; }
    .dot.active { width: 26px; background: var(--forest); }

    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .quick-card {
      background: var(--mint); border-radius: var(--radius-md); padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--forest);
    }

    .task-check {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .task-check.done {
      background: var(--fresh); border-color: var(--fresh); color: var(--white);
      transform: scale(1.08);
    }

    .scanner-box {
      background: #101D14; border-radius: var(--radius-lg); height: 290px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      color: var(--white);
    }
    .scanner-media {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.86;
    }
    .scanner-frame {
      width: 210px; height: 210px; border: 2.5px dashed var(--light); border-radius: 28px;
      position: relative; z-index: 2; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; text-align: center; padding: 14px;
      background: rgba(16, 29, 20, 0.38);
    }
    .scanner-actions { display:flex; gap:8px; margin-top:8px; }
    .scan-result-item { padding:10px 0; border-top:1px solid var(--border); }
    .scan-result-item:first-child { border-top:0; }
    .scan-line {
      position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 99px;
      background: var(--fresh); box-shadow: 0 0 14px 2px var(--fresh);
      animation: scanLaser 1.25s infinite ease-in-out;
    }

    .mode-switch {
      background: var(--white); padding: 4px; border-radius: 999px;
      display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border);
    }
    .mode-btn { padding: 8px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .mode-btn.active { background: var(--forest); color: var(--white); }

    .plant-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric-card {
      background: var(--white); border-radius: var(--radius-md); padding: 12px;
      display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow);
    }
    .metric-icon {
      width: 38px; height: 38px; border-radius: 12px; background: var(--mint);
      color: var(--forest); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .chat-area { display: flex; flex-direction: column; gap: 12px; padding-bottom: 76px; }
    .bubble {
      max-width: 84%; padding: 12px 15px; border-radius: 18px;
      font-size: 0.88rem; line-height: 1.55; animation: popIn 0.25s ease;
    }
    .bubble.ai {
      background: var(--white); color: var(--text); align-self: flex-start;
      box-shadow: var(--shadow); border-end-start-radius: 4px;
    }
    .bubble.user {
      background: var(--forest); color: var(--white); align-self: flex-end;
      border-end-end-radius: 4px;
    }
    .typing-dots { display: flex; gap: 5px; padding: 4px 2px; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--fresh);
      animation: bounceDot 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.32s; }

    .chat-dock {
      position: fixed; bottom: 76px; width: 100%; max-width: 430px;
      padding: 8px 14px; background: linear-gradient(180deg, transparent, var(--bg) 30%);
    }
    .chat-input-wrap {
      background: var(--white); border-radius: 999px; border: 1px solid var(--border);
      padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
    }
    .chat-input-wrap input { border: none; outline: none; flex: 1; font-family: inherit; font-size: 0.88rem; }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--fresh); color: var(--white);
      display: flex; align-items: center; justify-content: center;
    }

    .cal-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-day {
      background: var(--white); padding: 10px 4px; border-radius: 14px; font-size: 0.74rem;
      color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cal-day.active { background: var(--forest); color: var(--white); transform: translateY(-2px); box-shadow: var(--shadow); }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--fresh); }

    .plan-card {
      background: var(--white); border: 2px solid var(--border); border-radius: var(--radius-md);
      padding: 16px; position: relative; transition: 0.2s;
    }
    .plan-card.selected { border-color: var(--forest); background: var(--mint); transform: scale(1.01); }
    .best-badge {
      position: absolute; top: -11px; inset-inline-end: 16px;
      background: linear-gradient(90deg, var(--fresh), #66BB6A, var(--fresh));
      background-size: 200% 100%; animation: shimmer 2.5s infinite linear;
      color: var(--white); font-size: 0.72rem; font-weight: 700; padding: 4px 11px; border-radius: 999px;
    }

    .switch { width: 46px; height: 26px; border-radius: 999px; background: #CBD8CC; position: relative; transition: 0.2s; }
    .switch.on { background: var(--fresh); }
    .switch::after {
      content: ''; position: absolute; top: 3px; inset-inline-start: 3px;
      width: 20px; height: 20px; border-radius: 50%; background: var(--white); transition: 0.22s;
    }
    .switch.on::after { transform: translateX(20px); }
    html[dir="rtl"] .switch.on::after { transform: translateX(-20px); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(16, 29, 20, 0.45); backdrop-filter: blur(4px);
      z-index: 90; display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      width: 100%; max-width: 430px; background: var(--white);
      border-radius: 26px 26px 0 0; padding: 20px 20px 28px;
      animation: screenIn 0.25s ease;
    }

    .toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--white); padding: 10px 18px;
      border-radius: 999px; font-size: 0.82rem; font-weight: 600; z-index: 120;
      box-shadow: 0 10px 26px rgba(0,0,0,0.2);
    }

    .burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
    .burst-item {
      position: fixed; font-size: 1.2rem; animation: burstLeaf 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app">
    <div style="padding:40px 22px; text-align:center; margin:auto;">
      <h2 style="color:#1B5E35;">🌿 PlantUp</h2>
      <p style="margin-top:10px;">لو ظهرت لك هذه الرسالة ولم يفتح التطبيق، فالمتصفح أو تطبيق عرض الملفات الحالي يمنع تشغيل JavaScript.<br><br>جرّب فتح الملف عبر متصفح <strong>Chrome</strong> أو الصق الكود في موقع <strong>codepen.io</strong>.</p>
    </div>
  </div>
  <div class="burst-layer" id="burst-layer"></div>

  <script>
    window.addEventListener('error', function (event) {
      const app = document.getElementById('app');
      if (app && !app.dataset.runtimeError) {
        app.dataset.runtimeError = '1';
        app.innerHTML = '<div style="padding:28px;text-align:center;margin:auto;direction:rtl"><h2 style="color:#1B5E35">تعذر تشغيل PlantUp</h2><p style="margin-top:12px">حدث خطأ في JavaScript. افتح الملف في Chrome وحدّث الصفحة. إذا استمرت المشكلة أرسل رسالة الخطأ للمطور.</p><p style="margin-top:10px;direction:ltr;overflow-wrap:anywhere">' + String(event.message || 'Unknown error') + '</p></div>';
      }
    });
    const icons = {
      home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
      plant: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>',
      camera: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      compass: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
      sparkle: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      back: '<svg class="flip-rtl" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>',
      search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      crown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>',
      sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
      drop: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
      soil: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h18M5 21h14M12 3v10m-4-4l4-4 4 4"/></svg>',
      temp: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

    function t() { return T[state.lang]; }
    function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function triggerBurst(x, y, emoji) {
      const layer = document.getElementById('burst-layer');
      if (!layer) return;
      const cx = x || window.innerWidth / 2;
      const cy = y || window.innerHeight / 2;
      const items = [emoji || '🌿', '💧', '✨', '🌱', '🍃'];
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('span');
        el.className = 'burst-item';
        el.textContent = items[i % items.length];
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        el.style.setProperty('--tx', (Math.random() * 140 - 70) + 'px');
        el.style.setProperty('--ty', (Math.random() * -110 - 20) + 'px');
        layer.appendChild(el);
        setTimeout(function() { el.remove(); }, 900);
      }
    }

    function showToast(msg) {
      const existing = document.getElementById('toast-el');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.id = 'toast-el';
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.remove(); }, 2200);
    }

    function stopCamera() {
      if (liveStream) {
        liveStream.getTracks().forEach(function(tr) { tr.stop(); });
        liveStream = null;
      }
    }

    async function toggleLiveCamera() {
      if (liveStream) {
        stopCamera();
        render();
        return;
      }
      if (!window.isSecureContext) {
        showToast(state.lang === 'ar' ? 'الكاميرا تحتاج فتح الموقع عبر HTTPS أو localhost، وليس ملف HTML مباشرة' : 'Camera requires HTTPS or localhost; opening the HTML file directly will block it');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast(state.lang === 'ar' ? 'المتصفح لا يدعم تشغيل الكاميرا. افتح الصفحة في Chrome.' : 'Camera API unavailable. Open this page in Chrome.');
        return;
      }
      try {
        liveStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } });
        render();
        const vid = document.getElementById('live-video');
        if (vid) {
          vid.srcObject = liveStream;
          await vid.play().catch(function(){});
        }
      } catch (e) {
        console.error('PlantUp camera error:', e);
        const reason = e && e.name ? e.name : 'Camera permission/device error';
        showToast((state.lang === 'ar' ? 'تعذر فتح الكاميرا: ' : 'Could not open camera: ') + reason);
      }
    }

    function setLang(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      saveState();
      render();
    }

    function go(screen, extra) {
      if (screen !== 'identify' && screen !== 'doctor') stopCamera();
      if (screen !== state.screen && ['details','premium','profile'].indexOf(state.screen) === -1) {
        state.prevScreen = state.screen;
      }
      if (extra) Object.assign(state, extra);
      state.screen = screen;
      saveState();
      render();
      window.scrollTo(0, 0);
    }

    function openPlant(id) {
      state.selectedPlantId = id;
      go('details');

    function addPlantToRoom(id, roomIdx, e) {
      const exists = state.myPlants.find(function(p) { return p.id === id; });
      if (!exists) {
        state.myPlants.unshift({ id: id, roomIdx: roomIdx, health: 'healthy', nextEn: 'Water in 5 days', nextAr: 'الري بعد 5 أيام' });
      } else {
        exists.roomIdx = roomIdx;
      }
      activeModal = null;
      saveState();
      if (e) triggerBurst(e.clientX, e.clientY, '🪴');
      showToast(t().toastAdded);
      render();
    }

    function toggleTask(id, e) {
      const task = state.tasks.find(function(x) { return x.id === id; });
      if (task) {
        task.done = !task.done;
        saveState();
        if (task.done) {
          if (e) triggerBurst(e.clientX, e.clientY, '💧');
          showToast(t().toastDone);
        }
        render();
      }
    }

        saveState();

      }

    function captureAndIdentify() {
      const video = document.getElementById('live-video');
      if (!liveStream || !video || !video.videoWidth) {
        showToast(state.lang === 'ar' ? 'افتح الكاميرا أولاً وانتظر ظهور الصورة' : 'Start the camera and wait for the preview first');
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        if (!blob) {
          showToast(state.lang === 'ar' ? 'تعذر التقاط الصورة' : 'Could not capture image');
          return;
        }
        state.scanImg = canvas.toDataURL('image/jpeg', 0.9);
        const imageFile = new File([blob], 'plantup-scan.jpg', { type: 'image/jpeg' });
        stopCamera();
        identifyPlant(imageFile);
      }, 'image/jpeg', 0.9);
    }

    async function identifyPlant(file) {
      state.scanError = null;
      if (!file || !file.type || !file.type.startsWith('image/')) {
        state.scanError = state.lang === 'ar' ? 'الملف المختار ليس صورة مدعومة. اختر صورة JPG أو PNG.' : 'The selected file is not a supported image. Choose JPG or PNG.';
        render();
        return;
      }
      state.scanning = true;
      state.scanFound = null;
      state.scanApiResult = null;
      state.docDiagnosed = false;
      render();
      try {
        // Convert browser-decodable formats (for example WEBP) to JPEG; Pl@ntNet accepts JPEG/PNG.
        let uploadFile = file;
        if (file.type !== 'image/jpeg' && file.type !== 'image/png') {
          const bitmap = await createImageBitmap(file);
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          canvas.getContext('2d').drawImage(bitmap, 0, 0);
          bitmap.close && bitmap.close();
          const blob = await new Promise(function(resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.9); });
          if (!blob) throw new Error('Could not convert this image. Try JPG or PNG.');
          uploadFile = new File([blob], 'plantup-photo.jpg', { type: 'image/jpeg' });
        }
        const apiKey = getPlantNetApiKey();
        if (!apiKey) throw new Error(state.lang === 'ar'
          ? 'لم يتم إدخال مفتاح Pl@ntNet API. أعد الفحص وأدخل المفتاح.'
          : 'No Pl@ntNet API key was entered. Start the scan again and enter your key.');
        const form = new FormData();
        form.append('images', uploadFile, uploadFile.name || 'plant.jpg');
        form.append('organs', 'auto');
        const url = PLANTNET_API_URL + '?lang=' + (state.lang === 'ar' ? 'ar' : 'en') + '&nb-results=5&api-key=' + encodeURIComponent(apiKey);
        const response = await fetch(url, { method: 'POST', body: form });
        const data = await response.json().catch(function() { return {}; });
        if (!response.ok) {
          const detail = data.message || data.error || ('HTTP ' + response.status);
          throw new Error(detail + ' (status ' + response.status + ')');
        }
        state.scanApiResult = data;
        const scientific = data.results && data.results[0] && data.results[0].species ? data.results[0].species.scientificNameWithoutAuthor || data.results[0].species.scientificName : '';
        const known = PLANTS_DB.find(function(p) { return p.sci.toLowerCase() === String(scientific).toLowerCase(); });
        state.scanFound = known ? known.id : null;
        if (!data.results || !data.results.length) showToast(state.lang === 'ar' ? 'لم يتم العثور على تطابق. جرّب صورة واضحة للورقة.' : 'No match found. Try a clear photo of the leaf.');
        else triggerBurst(null, 240, '🌿');
      } catch (error) {
        console.error('Pl@ntNet identification error:', error);
        const msg = String(error && error.message || error);
        state.scanError = msg.indexOf('Failed to fetch') >= 0
          ? (state.lang === 'ar' ? 'تعذر الاتصال بخدمة Pl@ntNet. قد يكون السبب اتصال الإنترنت أو منع المتصفح للطلب (CORS). جرّب فتح الصفحة من استضافة HTTPS.' : 'Could not reach Pl@ntNet. Check internet or browser CORS restrictions; try an HTTPS-hosted page.')
          : msg;
      } finally {
        state.scanning = false;
        render();
      }
    }

    function runSampleScan(target) {
      state.scanError = null;
      state.scanning = true;
      state.scanFound = null;
      state.scanApiResult = null;
      state.docDiagnosed = false;
      render();
      setTimeout(function() {
        state.scanning = false;
        if (target === 'identify') {
          const idx = Math.floor(Math.random() * PLANTS_DB.length);
          state.scanFound = PLANTS_DB[idx].id;
        } else {
          state.docDiagnosed = true;
        }
        triggerBurst(null, 240, '✨');
        render();
      }, 1200);
    }

    function askAIWithContext() {
      state.messages.push({
        sender: 'ai',
        en: 'I reviewed your Plant Doctor report (' + T.en.issueName + '). Hold off watering for 5 days and keep good airflow!',
        ar: 'اطّلعت على تقرير طبيب النبات (' + T.ar.issueName + '). توقفي عن الري لمدة 5 أيام مع تهوية جيدة!'
      });
      saveState();
      go('ai');
    }

    function sendChat(text) {
      const q = text.trim();
      if (!q) return;
      state.messages.push({ sender: 'user', custom: q });
      aiTyping = true;
      render();
      window.scrollTo(0, document.body.scrollHeight);

      setTimeout(function() {
        aiTyping = false;
        const lower = q.toLowerCase();
        let replyEn = 'Great question! Most houseplants thrive in bright indirect light. Always test the top 3cm of soil with your finger before watering.';
        let replyAr = 'سؤال ممتاز! معظم النباتات المنزلية تفضل الإضاءة الساطعة غير المباشرة. اختبر دائماً جفاف أول 3 سم من التربة بإصبعك قبل الري.';

        if (lower.indexOf('yellow') > -1 || q.indexOf('اصفر') > -1 || q.indexOf('تصفر') > -1) {
          replyEn = 'Yellowing leaves most often point to overwatering or clogged pot drainage. Let the soil dry out slightly and empty any excess water.';
          replyAr = 'اصفرار الأوراق يشير غالباً إلى زيادة الري أو انسداد فتحات التصريف. اترك التربة تجف قليلاً وتخلّص من الماء الزائد في صحن الأصيص.';
        } else if (lower.indexOf('low') > -1 || q.indexOf('ضعيفة') > -1 || q.indexOf('قليلة') > -1) {
          replyEn = 'Golden Pothos, Snake Plant, and ZZ Plant are top champions for low-light rooms!';
          replyAr = 'نبتة البوتس الذهبية، جلد النمر، ونبتة الزاميا هي الأفضل للغرف ذات الإضاءة الضعيفة!';
        } else if (lower.indexOf('propagat') > -1 || q.indexOf('اكثار') > -1 || q.indexOf('إكثار') > -1 || q.indexOf('كثر') > -1) {
          replyEn = 'To propagate Pothos: snip just below a brown node, place in clean water near bright light, and roots will sprout within 2 weeks!';
          replyAr = 'لإكثار البوتس: قص غصناً أسفل العقدة البنية مباشرة، وضعه في كوب ماء نظيف بمكان مضيء وستظهر الجذور خلال أسبوعين!';
        }

        state.messages.push({ sender: 'ai', en: replyEn, ar: replyAr });
        saveState();
        render();
        window.scrollTo(0, document.body.scrollHeight);
      }, 700);
    }

    function render() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      const app = document.getElementById('app');

      if (!state.onboarded) {
        app.innerHTML = renderOnboarding();
        return;
      }

      let body = '';
      if (state.screen === 'home') body = renderHome();
      else if (state.screen === 'identify') body = renderIdentify();
      else if (state.screen === 'details') body = renderDetails();
      else if (state.screen === 'doctor') body = renderDoctor();
      else if (state.screen === 'ai') body = renderAI();
      else if (state.screen === 'myplants') body = renderMyPlants();
      else if (state.screen === 'discover') body = renderDiscover();
      else if (state.screen === 'premium') body = renderPremium();
      else if (state.screen === 'profile') body = renderProfile();

      const hideNav = ['details', 'premium'].indexOf(state.screen) > -1;
      const navHtml = hideNav ? '' : '<nav class="bottom-nav">' +
        '<button class="nav-item ' + (state.screen === 'home' ? 'active' : '') + '" onclick="go(\'home\')">' + icons.home + '<span>' + t().nav.home + '</span></button>' +
        '<button class="nav-item ' + (state.screen === 'myplants' ? 'active' : '') + '" onclick="go(\'myplants\')">' + icons.plant + '<span>' + t().nav.plants + '</span></button>' +
        '<div class="nav-scan-wrap"><button class="nav-scan-btn" onclick="go(\'identify\')">' + icons.camera + '</button></div>' +
        '<button class="nav-item ' + (state.screen === 'discover' ? 'active' : '') + '" onclick="go(\'discover\')">' + icons.compass + '<span>' + t().nav.discover + '</span></button>' +
        '<button class="nav-item ' + (state.screen === 'ai' ? 'active' : '') + '" onclick="go(\'ai\')">' + icons.sparkle + '<span>' + t().nav.ai + '</span></button>' +
      '</nav>';

      app.innerHTML = body + navHtml + renderModal();

      if (liveStream) {
        const vid = document.getElementById('live-video');
        if (vid) vid.srcObject = liveStream;
      }
    }

    render();
  </script>
</body>
</html>
